# Bro.exe — low-memory friendly Gradle settings.
# Keep the daemon heap modest so the project can be built on constrained CI runners.
org.gradle.jvmargs=-Xmx2560m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true

# The native binding targets compileSdk 36. AGP 8.7.x is only "tested" to 35,
# so silence the cosmetic warning instead of letting it pollute CI logs.
android.suppressUnsupportedCompileSdk=36

kotlin.code.style=official
