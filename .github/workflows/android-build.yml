name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# llama.cpp revision this project's native binding is pinned to
# (lfm2 arch support; scripts/llm_smoke_test.sh verified this exact commit).
env:
  LLAMA_CPP_REF: 358a420ec4ed59b6b0be08b1d1f71dd478b99a99

jobs:
  # Blocking gate: prove the exact GGUF shipped inside the APK (Qwen2.5-0.5B-Instruct
  # Q6_K) loads and answers cleanly on the pinned llama.cpp revision, with no
  # reasoning/tool-control token leakage. Uses the script's defaults.
  model-smoke:
    name: Native LLM model smoke test (shipped Qwen2.5-0.5B)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run native smoke test
        run: bash scripts/llm_smoke_test.sh

  # Candidate chat-model gate: Qwen3.5-0.8B is REJECTED for voice -- it is a
  # reasoning model that leaks  thinking tokens and, unlike Qwen3, has no /no_think
  # soft switch; our pinned C API cannot pass enable_thinking=false. These two jobs
  # record that rejection and are intentionally non-blocking (continue-on-error).
  model-smoke-qwen:
    name: Qwen3.5-0.8B candidate smoke test (expected fail)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    env:
      LABEL: qwen35
      MODEL_NAME: Qwen3.5-0.8B-Q4_0.gguf
      MODEL_URL: https://huggingface.co/ggml-org/Qwen3.5-0.8B-GGUF/resolve/main/Qwen3.5-0.8B-Q4_0.gguf
      MODEL_SHA256: 57d1997790d1744fba5b40a7317df71ea5e2acee28c47e78f0cce39c0703f8cf
      EXPECTED_BYTES: "563036064"
      EXTRA_BANNED: "<think,</think,<|endoftext|>,add_vision_id,<|vision_start|>,<|vision_end|>,reasoning"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run native smoke test
        run: bash scripts/llm_smoke_test.sh

  # Same Qwen3.5 candidate, but with the closed think block injected after the
  # assistant header to reproduce what enable_thinking=false does. Qwen3.5 has no
  # /no_think soft switch and our pinned C API cannot pass template kwargs, so this
  # proves whether prompt-level think disabling actually yields a clean spoken
  # answer before we decide whether to adopt the model.
  model-smoke-qwen-nothink:
    name: Qwen3.5-0.8B think-off smoke test (expected fail)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    env:
      LABEL: qwen35nt
      MODEL_NAME: Qwen3.5-0.8B-Q4_0.gguf
      MODEL_URL: https://huggingface.co/ggml-org/Qwen3.5-0.8B-GGUF/resolve/main/Qwen3.5-0.8B-Q4_0.gguf
      MODEL_SHA256: 57d1997790d1744fba5b40a7317df71ea5e2acee28c47e78f0cce39c0703f8cf
      EXPECTED_BYTES: "563036064"
      EXTRA_BANNED: "<think,</think,assistant,reasoning"
      SMOKE_ASSISTANT_THINK_OFF: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run native smoke test
        run: bash scripts/llm_smoke_test.sh

  # Non-reasoning ChatML candidates (Qwen2.5 Instruct): no think tokens at all,
  # so they fit our existing template path unchanged. The 0.5B (620 MB Q6_K, RAM-safe
  # on a 3 GB device) is the shipped model, gated by `model-smoke` above; the 1.5B passes
  # too but is left here as a documented, larger alternative we do not ship.
  model-smoke-qwen25-15b:
    name: Qwen2.5-1.5B-Instruct candidate smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LABEL: qwen2515b
      MODEL_NAME: qwen2.5-1.5b-instruct-q4_k_m.gguf
      MODEL_URL: https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf
      MODEL_SHA256: 6a1a2eb6d15622bf3c96857206351ba97e1af16c30d7a74ee38970e434e9407e
      EXPECTED_BYTES: "1117320736"
      EXTRA_BANNED: "<think,</think,reasoning"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run native smoke test
        run: bash scripts/llm_smoke_test.sh

  # Streaming-ASR accuracy evidence: run the bundled 20M model and the larger
  # 2023-06-26 candidate on the same reference audio with the same sherpa-onnx
  # streaming-transducer engine, and require the new model's WER to be <= the old.
  asr-smoke:
    name: Streaming ASR WER smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install sherpa-onnx + numpy
        run: pip install --quiet sherpa-onnx==1.13.8 numpy

      - name: Run ASR WER smoke test
        run: bash scripts/asr_smoke_test.sh

  # Milestone 4: download every bundled model, generate the wake-word keywords,
  # and emit scripts/voice_assets.lock (+ scripts/voice_keywords.txt) as artifacts.
  voice-assets:
    name: Generate voice asset lock
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install sherpa-onnx CLI
        run: pip install --quiet sherpa-onnx==1.13.8 sentencepiece click pypinyin

      # The bundled models total ~600 MB (the shipped GGUF dominates). Cache the raw
      # downloads so only the first run after an asset change pays for the transfer.
      - name: Cache downloaded voice assets
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/voice-cache
          key: voice-assets-${{ hashFiles('scripts/voice_assets.manifest') }}
          restore-keys: voice-assets-

      - name: Fetch assets and generate lock
        env:
          VOICE_ASSET_CACHE: ${{ runner.temp }}/voice-cache
        run: bash scripts/fetch_voice_assets.sh "$RUNNER_TEMP/voice" generate

      - name: Show lock + keywords
        run: |
          echo "== scripts/voice_assets.lock =="
          cat scripts/voice_assets.lock
          echo "== keywords.txt =="
          cat "$RUNNER_TEMP/voice/keywords.txt"

      - name: Upload generated lock and keywords
        uses: actions/upload-artifact@v4
        with:
          name: voice-asset-lock
          path: |
            scripts/voice_assets.lock
            scripts/voice_keywords.txt

  build:
    name: Unit tests + debug APK
    runs-on: ubuntu-latest
    # Native llama.cpp cross-compile + multi-variant ggml is slow on a shared runner.
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Stable, non-secret debug key so successive builds install over each other.
      # Generated once (and then committed); future runs reuse the committed file.
      - name: Prepare stable debug keystore
        run: |
          mkdir -p keystore
          if [ ! -f keystore/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore keystore/debug.keystore \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 36500 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "generated a new debug keystore"
          else
            echo "reusing committed debug keystore"
          fi
          keytool -list -v -keystore keystore/debug.keystore -storepass android \
            | grep -E "Alias name|SHA256|SHA-256" || true

      # The native module (./llama) points CMake at third_party/llama.cpp.
      - name: Clone llama.cpp (pinned commit)
        run: |
          git init -q third_party/llama.cpp
          git -C third_party/llama.cpp remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C third_party/llama.cpp fetch -q --depth 1 origin "$LLAMA_CPP_REF"
          git -C third_party/llama.cpp checkout -q "$LLAMA_CPP_REF"
          echo "llama.cpp commit: $(git -C third_party/llama.cpp rev-parse HEAD)"

      - name: Fetch sherpa-onnx android libs (pinned)
        run: |
          curl -sSL --retry 3 -o /tmp/sherpa.tar.bz2 \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-v1.13.8-android.tar.bz2"
          tar -xjf /tmp/sherpa.tar.bz2 -C /tmp
          JNI="$PWD/third_party/sherpa-onnx/jniLibs/arm64-v8a"
          mkdir -p "$JNI"
          cp /tmp/jniLibs/arm64-v8a/libsherpa-onnx-jni.so "$JNI/"
          cp /tmp/jniLibs/arm64-v8a/libonnxruntime.so "$JNI/"
          ls -la "$JNI"

      - name: Cache downloaded voice assets
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/voice-cache
          key: voice-assets-${{ hashFiles('scripts/voice_assets.manifest') }}
          restore-keys: voice-assets-

      # Verify each bundled asset against the committed lock (size + sha256), then
      # stage it under app/src/main/assets/voice for packaging.
      - name: Fetch and verify bundled voice assets
        env:
          VOICE_ASSET_CACHE: ${{ runner.temp }}/voice-cache
        run: bash scripts/fetch_voice_assets.sh app/src/main/assets/voice verify

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # AGP can auto-install these, but doing it explicitly makes failures obvious.
      - name: Install SDK platform, NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0" \
            "ndk;27.0.12077973" "cmake;3.31.6"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build sherpa-onnx module
        run: ./gradlew --no-daemon :sherpa:assembleRelease

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Verify APK contents (the shipped brain is inside)
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          ls -la "$APK"
          echo "== native libs =="
          unzip -l "$APK" | grep -E '\.so$' || true
          echo "== voice assets =="
          unzip -l "$APK" | grep 'assets/voice/'
          for f in \
            assets/voice/keywords.txt \
            assets/voice/licenses/Qwen2.5-0.5B-Instruct-Apache-2.0.txt \
            assets/voice/models/qwen2.5-0.5b-instruct-q6_k.gguf \
            assets/voice/models/kws/encoder.int8.onnx \
            assets/voice/models/kws/tokens.txt \
            assets/voice/models/asr/encoder.int8.onnx \
            assets/voice/models/asr/tokens.txt \
            assets/voice/models/tts/en_US-ryan-low.onnx \
            assets/voice/models/vad/silero_vad.onnx ; do
            unzip -l "$APK" | grep -qF "$f" || { echo "MISSING: $f"; exit 1; }
          done
          echo "all expected voice assets present"

          echo "== PROOF: the APK ships the pinned Silero VAD (EHS confirmor) =="
          VAD_IN_APK=assets/voice/models/vad/silero_vad.onnx
          VAD_SHA=9e2449e1087496d8d4caba907f23e0bd3f78d91fa552479bb9c23ac09cbb1fd6
          VAD_BYTES=643854
          unzip -p "$APK" "$VAD_IN_APK" > /tmp/embedded_vad.onnx
          VAD_GOT_BYTES=$(wc -c < /tmp/embedded_vad.onnx)
          VAD_GOT_SHA=$(sha256sum /tmp/embedded_vad.onnx | awk '{print $1}')
          echo "embedded vad bytes=$VAD_GOT_BYTES sha256=$VAD_GOT_SHA"
          [ "$VAD_GOT_BYTES" = "$VAD_BYTES" ] || { echo "FAIL: embedded VAD size $VAD_GOT_BYTES != $VAD_BYTES"; exit 1; }
          [ "$VAD_GOT_SHA" = "$VAD_SHA" ] || { echo "FAIL: embedded VAD sha256 mismatch"; exit 1; }
          echo "PROOF OK: APK ships the exact pinned Silero VAD used by the EHS gate."

          echo "== PROOF: the APK embeds the verified Qwen GGUF (no download needed) =="
          GGUF_IN_APK=assets/voice/models/qwen2.5-0.5b-instruct-q6_k.gguf
          PINNED_SHA=2f82233630c349ccf6b8daccf48f9a7865713d9f08a2eadfa456cebe9b97c7f5
          PINNED_BYTES=650379104
          unzip -p "$APK" "$GGUF_IN_APK" > /tmp/embedded.gguf
          GOT_BYTES=$(wc -c < /tmp/embedded.gguf)
          GOT_SHA=$(sha256sum /tmp/embedded.gguf | awk '{print $1}')
          echo "embedded bytes=$GOT_BYTES sha256=$GOT_SHA"
          [ "$GOT_BYTES" = "$PINNED_BYTES" ] || { echo "FAIL: embedded GGUF size $GOT_BYTES != $PINNED_BYTES"; exit 1; }
          [ "$GOT_SHA" = "$PINNED_SHA" ] || { echo "FAIL: embedded GGUF sha256 mismatch"; exit 1; }
          echo "PROOF OK: APK ships the exact pinned Qwen2.5-0.5B-Instruct Q6_K GGUF."

          echo "== PROOF: no on-device LLM download path remains in the ai package =="
          if grep -RInE 'OkHttp|ModelDownloader|ModelStore|isDownloadable|DOWNLOADED|\.download\(' \
               app/src/main/java/com/elthon/broexe/ai 2>/dev/null ; then
            echo "FAIL: a model download code path still exists under com/elthon/broexe/ai"
            exit 1
          fi
          echo "PROOF OK: the ai package has no model network/download code."

      - name: Build release APK (R8 full mode + resource shrink + baseline profile)
        run: ./gradlew --no-daemon assembleRelease

      - name: Verify release APK (shrinking kept the shipped brain + voice + profile)
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          ls -la "$APK"
          unzip -l "$APK" | grep -qF 'assets/voice/models/qwen2.5-0.5b-instruct-q6_k.gguf' \
            || { echo "MISSING: shipped GGUF was stripped from the release APK"; exit 1; }
          unzip -l "$APK" | grep -qF 'assets/voice/models/tts/en_US-ryan-low.onnx' \
            || { echo "MISSING: shipped TTS was stripped from the release APK"; exit 1; }
          if unzip -l "$APK" | grep -q 'assets/dexopt/baseline.prof'; then
            echo "baseline profile packaged: assets/dexopt/baseline.prof"
          else
            echo "WARN: assets/dexopt/baseline.prof absent (profile may have been ignored)"
          fi
          echo "PROOF OK: release APK builds under R8 full mode and still ships model + voice."

      - name: Upload release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bro-exe-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: warn

      - name: Stage versioned APK + build info
        if: success()
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          SHA7=$(git rev-parse --short=7 HEAD)
          VERSION_NAME=$(grep '^versionName=' VERSION | cut -d= -f2)
          VERSION_CODE=$(grep '^versionCode=' VERSION | cut -d= -f2)
          OUT="bro-exe-v${VERSION_NAME}-${SHA7}-debug.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT" > "$OUT.sha256"
          {
            echo "appId=com.elthon.broexe"
            echo "versionCode=${VERSION_CODE}"
            echo "versionName=${VERSION_NAME}"
            echo "commit=$(git rev-parse HEAD)"
            echo "commitShort=${SHA7}"
            echo "runUrl=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "apkFile=${OUT}"
            cat "$OUT.sha256"
          } > BUILD_INFO.txt
          echo "== BUILD_INFO.txt =="
          cat BUILD_INFO.txt

      - name: Verify APK signature (install-over check)
        if: success()
        run: |
          BT="$ANDROID_HOME/build-tools/36.0.0"
          "$BT/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk \
            | grep -iE "Signer #1 certificate (DN|SHA-256)" || true

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bro-exe-debug-apk
          path: |
            bro-exe-*-debug.apk
            bro-exe-*-debug.apk.sha256
            BUILD_INFO.txt
          if-no-files-found: warn

      - name: Upload debug keystore (one-time, to commit)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-keystore
          path: keystore/debug.keystore
          if-no-files-found: warn
